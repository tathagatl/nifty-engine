# Pre-declared variants of the swing rules, each changing one thing from v1
# (except "trend follower", which combines the exit changes).
# Decided BEFORE looking at results, to limit curve-fitting.
#
# Each variant is tested over the same history and judged separately on
# in-sample (before split_date) and out-of-sample (from split_date) trades.

split_date = "2023-01-01"

[variants."v1 baseline"]

[variants."time stop 30 days"]
time_stop_days = 30

[variants."no time stop"]
time_stop_days = 0

[variants."trail on 50-day"]
trail_sma = 50

[variants."no half at +2R"]
take_half = false

[variants."volume 1.3x"]
volume_multiple = 1.3

[variants."stop up to 10%"]
max_stop_pct = 0.10

[variants."trend follower"]
time_stop_days = 0
trail_sma = 50
take_half = false
