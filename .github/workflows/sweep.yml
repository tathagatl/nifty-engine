name: rule-variants

on:
  workflow_dispatch:
  push:
    paths:
      - research/sweep.toml
      - run_sweep.py

permissions:
  contents: write

concurrency:
  group: engine-state
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python run_sweep.py 10y
      - name: Commit results
        run: |
          git config user.name "nifty-engine"
          git config user.email "nifty-engine@users.noreply.github.com"
          git add out/sweep.md out/sweep.json data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "rule variants: 10y"
          git pull --rebase
          git push
