name: backtest

on:
  workflow_dispatch:
    inputs:
      period:
        description: "History to test (Yahoo period, e.g. 10y, 5y, max)"
        default: "10y"
  push:
    paths:
      - config.toml
      - engine/rules.py
      - engine/portfolio.py

permissions:
  contents: write

concurrency:
  group: engine-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python run_backtest.py "${{ github.event.inputs.period || '10y' }}"
      - name: Commit backtest report
        run: |
          git config user.name "nifty-engine"
          git config user.email "nifty-engine@users.noreply.github.com"
          git add out/backtest.md out/backtest_fills.csv out/backtest_equity.csv data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "backtest: ${{ github.event.inputs.period || '10y' }}"
          git pull --rebase
          git push
