name: daily-engine

# GitHub can start scheduled runs late (the first one ran 7 hours late), and Yahoo
# sometimes publishes the Nifty bar late. Runs are idempotent: a run with no new
# trading day changes nothing. So the engine runs three times per trading day:
on:
  schedule:
    - cron: "40 11 * * 1-5"      # 17:10 IST, Mon-Fri: main run after the close
    - cron: "10 14 * * 1-5"      # 19:40 IST, Mon-Fri: catch-up
    - cron: "10 2 * * 2-6"       # 07:40 IST, Tue-Sat: catch-up before the 08:20 brief
  push:
    branches: [main]
    paths:
      - "engine/**"
      - run_daily.py
      - .github/workflows/daily.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # latest state, not the commit that queued this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Run the rulebook on the latest close
        run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "nifty-engine"
          git config user.email "nifty-engine@users.noreply.github.com"
          git add out state data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "engine: $(jq -r .as_of out/status.json)"
          git pull --rebase
          git push
