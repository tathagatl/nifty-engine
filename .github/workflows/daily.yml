name: daily-engine

# Runs are idempotent: a run with no new trading day changes nothing.
# GitHub has been starting this repo's scheduled runs about 7 hours late, so the
# crons are only a backup. The reliable trigger is the 08:20 IST morning brief,
# which pushes trigger/run.txt when the data is behind; push runs start at once.
# NSE's end-of-day files appear around 18:00 IST, so evening runs come after that.
on:
  schedule:
    - cron: "40 13 * * 1-5"      # 19:10 IST, Mon-Fri
    - cron: "40 16 * * 1-5"      # 22:10 IST, Mon-Fri
  push:
    branches: [main]
    paths:
      - "trigger/**"
      - "engine/**"
      - run_daily.py
      - .github/workflows/daily.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # latest state, not the commit that queued this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Run the rulebook on the latest close
        run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "nifty-engine"
          git config user.email "nifty-engine@users.noreply.github.com"
          git add out state data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "engine: $(jq -r .as_of out/status.json)"
          git pull --rebase
          git push
