name: daily-engine

on:
  schedule:
    - cron: "40 11 * * 1-5"      # 17:10 IST, Monday to Friday (GitHub cron is UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Run the rulebook on today's close
        run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "nifty-engine"
          git config user.email "nifty-engine@users.noreply.github.com"
          git add out state data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "engine: $(jq -r .as_of out/status.json)"
          git pull --rebase
          git push
